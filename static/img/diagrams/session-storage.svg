<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="t" style="font-family: var(--ifm-font-family-monospace); font-size: 12px">
  <title id="t">Session logs and blobs are authoritative; checkpoints and the index are derived</title>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <!-- authoritative band -->
    <rect x="20" y="20" width="400" height="200" stroke-dasharray="4 4" opacity=".5"/>
    <rect x="40" y="50" width="170" height="60" stroke-width="2" style="stroke: var(--ifm-color-primary)"/>
    <text x="125" y="75" text-anchor="middle" fill="currentColor" stroke="none">sessions/&lt;id&gt;.jsonl</text>
    <text x="125" y="95" text-anchor="middle" fill="currentColor" stroke="none" opacity=".7">append-only events</text>
    <rect x="250" y="50" width="150" height="60" stroke-width="2" style="stroke: var(--ifm-color-primary)"/>
    <text x="325" y="75" text-anchor="middle" fill="currentColor" stroke="none">blobs/&lt;sha&gt;.*</text>
    <text x="325" y="95" text-anchor="middle" fill="currentColor" stroke="none" opacity=".7">content-addressed</text>
    <path d="M210 80 L250 80" marker-end="url(#arr2)"/>
    <text x="230" y="70" text-anchor="middle" fill="currentColor" stroke="none" style="font-size: 10px">payloadRefs</text>
    <!-- derived band -->
    <rect x="440" y="20" width="360" height="200" stroke-dasharray="4 4" opacity=".5"/>
    <rect x="460" y="50" width="150" height="60"/>
    <text x="535" y="75" text-anchor="middle" fill="currentColor" stroke="none">checkpoints</text>
    <text x="535" y="95" text-anchor="middle" fill="currentColor" stroke="none" opacity=".7">lastSeq · blobIds</text>
    <rect x="640" y="50" width="140" height="60"/>
    <text x="710" y="75" text-anchor="middle" fill="currentColor" stroke="none">index.db</text>
    <text x="710" y="95" text-anchor="middle" fill="currentColor" stroke="none" opacity=".7">sessions · FTS5</text>
    <rect x="460" y="140" width="320" height="60"/>
    <text x="620" y="165" text-anchor="middle" fill="currentColor" stroke="none">log-projections/&lt;id&gt;.jsonl</text>
    <text x="620" y="185" text-anchor="middle" fill="currentColor" stroke="none" opacity=".7">fingerprinted views of native agent logs</text>
    <path d="M125 110 L125 170 L440 170 L440 80 L460 80" marker-end="url(#arr2)"/>
    <path d="M610 80 L640 80" marker-end="url(#arr2)"/>
  </g>
  <g fill="currentColor" style="font-family: var(--ifm-heading-font-family); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .65">
    <text x="20" y="245">authoritative · back these up</text>
    <text x="440" y="245">derived · rebuilt from the left</text>
  </g>
</svg>
